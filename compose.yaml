services:
  postgres:
    image: 'postgres:latest'
    container_name: 'postgres'
    environment:
      - 'POSTGRES_DB=accountDB'
      - 'POSTGRES_PASSWORD=user_password'
      - 'POSTGRES_USER=myUser'
    ports:
      - '5432:5432'
    networks:
      - database
  redis:
    image: 'redis/redis-stack-server:latest'
    container_name: 'redis'
    ports:
      - '6379:6379'
networks:
  database:
    driver: bridge
    name: database